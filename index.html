<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <title>Oğlan Seçimi</title>
  <style>
    body {
      background: url('https://i.imgur.com/ZqZ8daT.jpg') no-repeat center center fixed;
      background-size: cover;
      font-family: Arial, sans-serif;
      color: white;
      text-align: center;
      padding-top: 50px;
    }

    .container {
      background: rgba(0, 0, 0, 0.7);
      padding: 30px;
      margin: 20px auto;
      width: 90%;
      max-width: 500px;
      border-radius: 10px;
    }

    select, button, textarea {
      width: 90%;
      max-width: 400px;
      padding: 10px;
      margin-top: 15px;
      font-size: 16px;
      border-radius: 5px;
      border: none;
    }

    button {
      background-color: #00aaff;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background-color: #0088cc;
    }

    textarea {
      resize: none;
    }

    .score {
      margin-top: 10px;
      font-size: 14px;
      color: #ffd;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Bir oğlan seç</h2>
    <select id="chosenPerson" onchange="updateScoreDisplay()">
      <option>Rəvan</option>
      <option>Xəyyam</option>
      <option>Nurlan</option>
      <option>Osman</option>
      <option>Saleh</option>
      <option>Ayxan</option>
    </select>
    <div class="score" id="scoreDisplay">Seçim sayı: 0</div>
    <button onclick="sendOrder()">Sifariş et</button>
  </div>

  <div class="container">
    <h3>Şərh yaz</h3>
    <textarea id="commentText" rows="4" placeholder="Buraya şərhini yaz..."></textarea><br>
    <button onclick="sendComment()">Göndər</button>
  </div>

  <script>
    const token = "7594990560:AAE3vW8HwndmTA550iMfJqwWF7f4ncTuFkk";
    const chat_id = "7279747469";

    const boys = ["Rəvan", "Xəyyam", "Nurlan", "Osman", "Saleh", "Ayxan"];

    function getScores() {
      return JSON.parse(localStorage.getItem("scores") || "{}");
    }

    function saveScores(scores) {
      localStorage.setItem("scores", JSON.stringify(scores));
    }

    function updateScoreDisplay() {
      const name = document.getElementById("chosenPerson").value;
      const scores = getScores();
      const count = scores[name] || 0;
      document.getElementById("scoreDisplay").innerText = "Seçim sayı: " + count;
    }

    function sendOrder() {
      const name = document.getElementById("chosenPerson").value;
      const scores = getScores();
      scores[name] = (scores[name] || 0) + 1;
      saveScores(scores);
      updateScoreDisplay();

      const message = "Yeni sifariş (oğlan): " + name;

      fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          chat_id: chat_id,
          text: message
        })
      })
      .then(res => {
        if (res.ok) alert("Sifariş göndərildi!");
        else alert("Xəta oldu. Yenidən yoxla.");
      });
    }

    function sendComment() {
      const text = document.getElementById("commentText").value.trim();
      if (!text) return alert("Şərh boş ola bilməz.");

      const message = "Yeni şərh:\n" + text;

      fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          chat_id: chat_id,
          text: message
        })
      })
      .then(res => {
        if (res.ok) {
          alert("Şərh göndərildi!");
          document.getElementById("commentText").value = "";
        } else {
          alert("Xəta baş verdi.");
        }
      });
    }

    window.onload = updateScoreDisplay;
  </script>

</body>
</html>
